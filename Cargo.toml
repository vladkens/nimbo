[package]
name = "nimbo"
version = "0.0.1"
edition = "2024"
description = "A small, fast, custom-drawn desktop UI toolkit: one look on macOS, Windows and Linux."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/nimbo"
homepage = "https://github.com/vladkens/nimbo"
documentation = "https://docs.rs/nimbo"
readme = "readme.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/readme.md"]
keywords = ["gui", "ui", "desktop", "widgets", "toolkit"]
categories = ["gui"]

[[test]]
name = "shapes"
harness = false

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSEvent", "NSGraphics", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSGraphicsContext"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFNumber", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSRunLoop", "NSObject", "NSNotification"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CADisplayLink", "CAFrameRateRange", "CATransaction"] }
