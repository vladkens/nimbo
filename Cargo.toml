[package]
name = "nimbo"
version = "0.0.1"
edition = "2024"
description = "A small, fast, custom-drawn desktop UI toolkit: one look on macOS, Windows and Linux."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/nimbo"
homepage = "https://github.com/vladkens/nimbo"
documentation = "https://docs.rs/nimbo"
readme = "readme.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/readme.md"]
keywords = ["gui", "ui", "desktop", "widgets", "toolkit"]
categories = ["gui"]

[dependencies]
keyboard-types = { version = "0.8.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2", "block2"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSEvent", "NSGraphics", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSGraphicsContext", "NSAppearance", "NSColor", "NSColorSpace", "block2", "NSTrackingArea", "NSCursor", "NSPasteboard", "NSFont", "NSFontDescriptor", "NSTextInputClient", "NSTextInputContext", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage", "NSBezierPath", "NSCell", "objc2-core-graphics", "NSPanel", "NSScreen", "NSWorkspace", "NSAlert", "NSPasteboardItem", "NSSavePanel", "NSOpenPanel", "NSDragging", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFNumber", "CFCGTypes", "CFAttributedString", "CFArray", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPath", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CTFont", "CTLine", "CTRun", "CTStringAttributes", "CTFontDescriptor", "CTFontTraits"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSRunLoop", "NSObject", "NSNotification", "NSArray", "NSUserDefaults", "NSAttributedString", "NSRange", "NSObjCRuntime", "NSBundle", "NSError", "NSEnumerator", "NSURL", "NSData", "NSProcessInfo", "NSValue"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CADisplayLink", "CAFrameRateRange", "CATransaction"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2-foundation", "objc2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
