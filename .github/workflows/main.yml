name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux only: macOS minutes count ten times against the free quota. `make check` clippies the
  # Windows target from here too.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: rustup target add x86_64-pc-windows-msvc x86_64-unknown-linux-gnu
      - run: make check
      - run: make test

  # The shared release steps (vladkens/actions): a `release: vX.Y.Z (#N)` commit is checked and
  # dry-run here, read-only, then `publish` puts it on crates.io through Trusted Publishing and
  # creates the tag and the GitHub release. A library: no release files.
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1

  publish:
    if: github.ref == 'refs/heads/main' # write rights only for main's own workflow
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
        with:
          files: false
